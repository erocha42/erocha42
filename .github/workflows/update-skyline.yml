name: Update contribution skyline

"on":
  schedule:
    - cron: "23 5 * * *"   # every day around 05:23 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["scripts/render_skyline.py", ".github/workflows/update-skyline.yml"]

permissions:
  contents: write

concurrency:
  group: skyline
  cancel-in-progress: false

jobs:
  skyline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/render_skyline.py "${{ github.repository_owner }}" contrib-skyline.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add contrib-skyline.svg
          git diff --cached --quiet || { git commit -m "chore: refresh contribution skyline [skip ci]"; git push; }
